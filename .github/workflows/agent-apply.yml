name: Agent apply changes

on:
  push:
    branches:
      - agent/stability-resizable-columns-context-defaults
    paths:
      - .agent/apply_changes.py
      - .github/workflows/agent-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/stability-resizable-columns-context-defaults
          fetch-depth: 0

      - name: Detect change script
        id: changes
        shell: bash
        run: |
          if [[ -f .agent/apply_changes.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up PHP
        if: steps.changes.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Apply requested changes
        if: steps.changes.outputs.present == 'true'
        run: python3 .agent/apply_changes.py

      - name: Add German translations for new UI states
        if: steps.changes.outputs.present == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('l10n/de.php')
          text = path.read_text(encoding='utf-8')
          marker = "\n);\n$PLURAL_FORMS"
          entries = {
              'Encrypted item unavailable': 'Verschlüsselter Eintrag nicht verfügbar',
              'Resize item column': 'Eintragsspalte in der Breite ändern',
              'Resize navigation column': 'Navigationsspalte in der Breite ändern',
              'The provider returned an unsupported key derivation configuration.': 'Der Anbieter hat eine nicht unterstützte Konfiguration für die Schlüsselableitung zurückgegeben.',
              'This item could not be decrypted completely and cannot be saved.': 'Dieser Eintrag konnte nicht vollständig entschlüsselt werden und kann nicht gespeichert werden.',
              'This item could not be decrypted completely and is therefore read-only.': 'Dieser Eintrag konnte nicht vollständig entschlüsselt werden und ist daher schreibgeschützt.',
          }

          missing = [
              (key, value)
              for key, value in entries.items()
              if f"  '{key}' =>" not in text
          ]

          if missing:
              if marker not in text:
                  raise SystemExit('Could not find translation array terminator')
              addition = ''.join(
                  f"  '{key}' => '{value}',\n"
                  for key, value in missing
              )
              text = text.replace(
                  marker,
                  f"\n{addition});\n$PLURAL_FORMS",
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Install frontend dependencies
        if: steps.changes.outputs.present == 'true'
        run: npm ci

      - name: Rebuild localization
        if: steps.changes.outputs.present == 'true'
        run: npm run l10n:build

      - name: Verify frontend and release preflight
        if: steps.changes.outputs.present == 'true'
        run: npm run verify

      - name: Install PHP development tools
        if: steps.changes.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist

      - name: Verify PHP
        if: steps.changes.outputs.present == 'true'
        run: |
          composer lint
          composer cs:check
          composer psalm

      - name: Commit validated changes
        if: steps.changes.outputs.present == 'true'
        shell: bash
        run: |
          rm -f .agent/apply_changes.py
          rmdir .agent 2>/dev/null || true
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Improve stability and vault interface"
          git push origin HEAD:agent/stability-resizable-columns-context-defaults
