name: Apply global vault search update

on:
  push:
    branches:
      - agent/stability-and-ui-improvements
    paths:
      - .agent/global-search.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Apply search behavior change
        run: python3 .agent/global-search.py

      - name: Install dependencies
        run: npm ci

      - name: Verify complete application
        run: npm run verify

      - name: Commit verified change
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .agent/global-search.py .github/workflows/apply-global-search.yml
          rmdir .agent 2>/dev/null || true
          git add -A
          git commit -m "Make vault search global across selected scope"
          git push origin HEAD:agent/stability-and-ui-improvements
