name: Verify

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests, lint, preflight, and production build
        run: npm run verify

  cleanup-temporary-branches:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Clean up temporary implementation branches'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Delete implementation backup branches
        run: |
          git push origin --delete agent/stability-and-ui-improvements-backup || true
          git push origin --delete agent/stability-and-ui-improvements-cleanup-backup || true
